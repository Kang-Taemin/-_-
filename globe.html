<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ETOPO 지구본</title>
    <style>
        #spin-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5em;
            border: 0; margin: 0.75em 0; padding: 0; }
        canvas { display: block; width: min(100%, 720px); height: auto; touch-action: none; }
        canvas.comparison, #comparison-labels { width: min(100%, 1440px); }
        #comparison-labels:not([hidden]) { display: grid; grid-template-columns: 1fr 1fr;
            text-align: center; margin-bottom: 0.4em; }
    </style>
</head>
<body>
    <label for="elevation-csv">고도 CSV</label>
    <input id="elevation-csv" type="file" accept=".csv,text/csv" disabled>
    <p id="status" role="status">ETOPO 1° CSV 파일을 선택하세요.</p>
    <fieldset id="spin-controls" aria-label="지구본 조작" disabled>
        <button id="spin-toggle" type="button">일시정지</button>
        <label for="spin-speed">자전 속도 (°/초)</label>
        <input id="spin-speed" type="range" min="1" max="60" value="12">
        <output id="spin-speed-value" for="spin-speed">12</output>
        <label for="sun-angle">태양 방위각 (°)</label>
        <input id="sun-angle" type="range" min="0" max="360" value="65">
        <output id="sun-angle-value" for="sun-angle">65</output>
        <label for="camera-radius">카메라 거리</label>
        <input id="camera-radius" type="range" min="1.5" max="8" step="0.01" value="3">
        <output id="camera-radius-value" for="camera-radius">3.00</output>
        <label for="terrain-mode">지형 표시</label>
        <select id="terrain-mode">
            <option value="displacement">정점 변위</option>
            <option value="bump">범프 매핑</option>
            <option value="compare">나란히 비교</option>
        </select>
    </fieldset>
    <div id="comparison-labels" hidden><span>정점 변위</span><span>범프 매핑</span></div>
    <canvas id="gl-canvas" width="720" height="720" aria-label="ETOPO 고도 지구본"></canvas>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 position;
        attribute float elevation;
        attribute vec3 vNormal;
        attribute vec2 vTexCoord;
        uniform mat4 modelView;
        uniform mat4 projection;
        uniform bool uUseBump;
        varying mediump float height;
        varying mediump vec3 normal;
        varying mediump vec3 radial;
        varying mediump vec2 texCoord;
        varying mediump vec3 tangent;
        varying mediump vec3 eyePosition;

        void main() {
            height = elevation;
            normal = mat3(modelView) * vNormal;
            vec3 unitPosition = normalize(position);
            radial = mat3(modelView) * unitPosition;
            texCoord = vTexCoord;
            float longitude = 6.28318530718 * (vTexCoord.x - 0.5);
            tangent = mat3(modelView) * vec3(-sin(longitude), 0.0, -cos(longitude));
            vec3 surfacePosition = uUseBump ? unitPosition : position;
            vec4 positionInEye = modelView * vec4(surfacePosition, 1.0);
            eyePosition = positionInEye.xyz;
            gl_Position = projection * positionInEye;
        }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        uniform mat4 view;
        uniform vec3 uLightDir;
        uniform bool uUseBump;
        uniform sampler2D uNormalMap;
        uniform vec2 uNormalMapSize;
        varying float height;
        varying vec3 normal;
        varying vec3 radial;
        varying vec2 texCoord;
        varying vec3 tangent;
        varying vec3 eyePosition;

        void main() {
            vec3 water = mix(vec3(0.16, 0.48, 0.73), vec3(0.02, 0.10, 0.29),
                clamp(-height / 7000.0, 0.0, 1.0));
            vec3 land = mix(vec3(0.23, 0.46, 0.23), vec3(0.95, 0.93, 0.84),
                clamp(height / 5500.0, 0.0, 1.0));
            float ocean = 1.0 - step(0.0, height);
            vec3 color = mix(land, water, ocean);
            vec3 L = normalize(mat3(view) * uLightDir);
            vec3 N = normalize(normal);
            vec3 radialNormal = normalize(radial);
            if (uUseBump) {
                vec3 T = normalize(tangent - radialNormal * dot(tangent, radialNormal));
                vec3 B = cross(radialNormal, T);
                mat3 TBN = mat3(T, B, radialNormal);
                vec2 uv = (texCoord * (uNormalMapSize - 1.0) + 0.5) / uNormalMapSize;
                vec3 normalSample = texture2D(uNormalMap, uv).rgb;
                vec3 tangentNormal = (normalSample * 255.0 - 128.0) / 127.0;
                N = normalize(TBN * tangentNormal);
            }
            // Use the globe horizon for twilight and the terrain normal for relief.
            float daylight = smoothstep(-0.035, 0.045, dot(L, radialNormal));
            float Kd = max(dot(L, N), 0.0);
            float shade = mix(0.055, 0.16, daylight) + 0.84 * daylight * Kd;

            vec3 V = normalize(-eyePosition);
            vec3 halfVector = L + V;
            vec3 H = halfVector / max(length(halfVector), 0.001);
            // Let the sea surface reflect the sun with only a little influence from the seabed.
            vec3 reflectionNormal = normalize(mix(N, radialNormal, 0.85 * ocean));
            float shininess = mix(24.0, 48.0, ocean);
            float specular = pow(clamp(dot(reflectionNormal, H), 0.0, 1.0), shininess);
            float directlyLit = smoothstep(0.0, 0.1, dot(reflectionNormal, L));
            specular *= mix(0.014, 0.16, ocean) * daylight * directlyLit;

            gl_FragColor = vec4(color * shade + vec3(1.0, 0.95, 0.85) * specular, 1.0);
        }
    </script>
    <script src="./webgl-utils.js"></script>
    <script src="./initShaders.js"></script>
    <script src="./MV.js"></script>
    <script src="globe.js"></script>
</body>
</html>
